<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scanner Angka Tulisan Tangan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #canvas {
            display: none;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }
        
        .btn-danger {
            background: #fc8181;
            color: white;
        }
        
        .btn-danger:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 129, 129, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .result-container {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .result-label {
            color: #4a5568;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .result-value {
            color: #2d3748;
            font-size: 32px;
            font-weight: bold;
            word-break: break-all;
        }
        
        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .status-success {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }
        
        .status-error {
            background: #fed7d7;
            color: #9b2c2c;
            display: block;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .manual-input {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .manual-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .manual-input input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Scanner Angka</h1>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="controls">
            <button id="scanBtn" class="btn btn-primary">📸 Scan</button>
            <button id="sendBtn" class="btn btn-success" disabled>📤 Kirim ke Sheet</button>
            <button id="clearBtn" class="btn btn-danger">🗑️ Clear</button>
        </div>
        
        <div id="loader" class="loader"></div>
        
        <div class="result-container">
            <div class="result-label">Hasil Scan:</div>
            <div id="resultText" class="result-value">-</div>
        </div>
        
        <div id="statusMessage" class="status-message"></div>
        
        <div class="manual-input">
            <input type="text" id="manualInput" placeholder="Atau ketik manual (contoh: 67,50)">
            <button id="manualSendBtn" class="btn btn-success" style="flex: 0 0 auto;">Kirim</button>
        </div>
    </div>

    <!-- Load Tesseract.js dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <script>
        // Konfigurasi - Ganti dengan URL Web App Anda
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzdo7B2IRVzVpi71IKhTePle1k772ST7fFbOI2RKu84A7PnRjPuwr0LZR2BoN-M1qjY/exec';
        
        // DOM Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const scanBtn = document.getElementById('scanBtn');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultText = document.getElementById('resultText');
        const statusMessage = document.getElementById('statusMessage');
        const loader = document.getElementById('loader');
        const manualInput = document.getElementById('manualInput');
        const manualSendBtn = document.getElementById('manualSendBtn');
        
        let currentResult = null;
        let stream = null;
        
        // Inisialisasi kamera
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
                await video.play();
                return true;
            } catch (error) {
                showStatus('Gagal mengakses kamera: ' + error.message, 'error');
                return false;
            }
        }
        
        // Capture gambar dari video
        function captureImage() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/png');
        }
        
        // Ekstrak angka dari gambar menggunakan Tesseract.js
        async function extractNumber(imageData) {
            try {
                showStatus('Memproses gambar...', 'info');
                
                const result = await Tesseract.recognize(
                    imageData,
                    'ind',
                    {
                        logger: m => console.log(m)
                    }
                );
                
                // Ambil teks yang terdeteksi
                const text = result.data.text;
                console.log('Teks terdeteksi:', text);
                
                // Cari pola angka dengan koma atau titik desimal
                const numberPattern = /(\d+[,.]\d{1,2})|(\d+)/g;
                const matches = text.match(numberPattern);
                
                if (matches && matches.length > 0) {
                    // Ambil angka pertama yang ditemukan
                    let number = matches[0];
                    // Konversi koma ke titik untuk parsing
                    number = number.replace(',', '.');
                    // Validasi apakah angka valid
                    const parsed = parseFloat(number);
                    if (!isNaN(parsed)) {
                        return parsed;
                    }
                }
                
                return null;
            } catch (error) {
                console.error('OCR Error:', error);
                showStatus('Error saat membaca: ' + error.message, 'error');
                return null;
            }
        }
        
        // Kirim data ke Google Sheet
        async function sendToSheet(number) {
            try {
                loader.style.display = 'block';
                sendBtn.disabled = true;
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        angka: number,
                        timestamp: new Date().toISOString()
                    })
                });
                
                // Karena mode no-cors, kita tidak bisa membaca response
                // Tapi data tetap terkirim
                showStatus('✅ Data berhasil dikirim ke Google Sheet!', 'success');
                
            } catch (error) {
                console.error('Send Error:', error);
                showStatus('❌ Gagal mengirim data: ' + error.message, 'error');
            } finally {
                loader.style.display = 'none';
                sendBtn.disabled = false;
            }
        }
        
        // Tampilkan status message
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message';
            
            if (type === 'success') {
                statusMessage.classList.add('status-success');
                statusMessage.style.display = 'block';
            } else if (type === 'error') {
                statusMessage.classList.add('status-error');
                statusMessage.style.display = 'block';
            } else if (type === 'info') {
                statusMessage.style.display = 'block';
                statusMessage.style.background = '#bee3f8';
                statusMessage.style.color = '#2a4365';
            }
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                if (type !== 'info') {
                    statusMessage.style.display = 'none';
                }
            }, 5000);
        }
        
        // Proses scan
        async function handleScan() {
            try {
                scanBtn.disabled = true;
                resultText.textContent = 'Memproses...';
                
                // Capture image
                const imageData = captureImage();
                
                // Ekstrak angka
                const number = await extractNumber(imageData);
                
                if (number !== null) {
                    currentResult = number;
                    resultText.textContent = number;
                    sendBtn.disabled = false;
                    showStatus(`✅ Angka ${number} berhasil dibaca!`, 'success');
                } else {
                    resultText.textContent = 'Tidak ada angka terdeteksi';
                    currentResult = null;
                    sendBtn.disabled = true;
                    showStatus('❌ Tidak ada angka yang terdeteksi dalam gambar', 'error');
                }
            } catch (error) {
                console.error('Scan Error:', error);
                resultText.textContent = 'Error';
                showStatus('❌ Error saat scan: ' + error.message, 'error');
            } finally {
                scanBtn.disabled = false;
            }
        }
        
        // Handler kirim
        async function handleSend() {
            if (currentResult === null) {
                showStatus('❌ Tidak ada data untuk dikirim', 'error');
                return;
            }
            
            await sendToSheet(currentResult);
        }
        
        // Handler manual input
        async function handleManualSend() {
            const input = manualInput.value.trim();
            if (!input) {
                showStatus('❌ Silakan masukkan angka', 'error');
                return;
            }
            
            // Validasi format angka
            const number = parseFloat(input.replace(',', '.'));
            if (isNaN(number)) {
                showStatus('❌ Format angka tidak valid', 'error');
                return;
            }
            
            // Tampilkan hasil
            currentResult = number;
            resultText.textContent = number;
            sendBtn.disabled = false;
            
            // Kirim langsung
            await sendToSheet(number);
            
            // Clear manual input
            manualInput.value = '';
        }
        
        // Handler clear
        function handleClear() {
            currentResult = null;
            resultText.textContent = '-';
            sendBtn.disabled = true;
            manualInput.value = '';
            showStatus('Data dibersihkan', 'info');
        }
        
        // Event Listeners
        scanBtn.addEventListener('click', handleScan);
        sendBtn.addEventListener('click', handleSend);
        clearBtn.addEventListener('click', handleClear);
        manualSendBtn.addEventListener('click', handleManualSend);
        
        // Enter key untuk manual input
        manualInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleManualSend();
            }
        });
        
        // Init
        initCamera();
        
        console.log('Scanner siap digunakan!');
        console.log('URL Web App:', WEB_APP_URL);
    </script>
</body>
</html>
