<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scanner Angka Tulisan Tangan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 98vh;
            overflow-y: auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #canvas, #canvasProcessed {
            display: none;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 80px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }
        
        .btn-danger {
            background: #fc8181;
            color: white;
        }
        
        .btn-danger:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 129, 129, 0.4);
        }
        
        .btn-warning {
            background: #ed8936;
            color: white;
        }
        
        .btn-warning:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(237, 137, 54, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .result-container {
            background: #f7fafc;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .result-label {
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .result-value {
            color: #2d3748;
            font-size: 28px;
            font-weight: bold;
            word-break: break-all;
        }
        
        .raw-text {
            color: #718096;
            font-size: 12px;
            margin-top: 5px;
            word-break: break-all;
        }
        
        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .status-success {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }
        
        .status-error {
            background: #fed7d7;
            color: #9b2c2c;
            display: block;
        }
        
        .status-info {
            background: #bee3f8;
            color: #2a4365;
            display: block;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .manual-input {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .manual-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .manual-input input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .settings {
            margin-top: 15px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 12px;
        }
        
        .settings label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4a5568;
        }
        
        .settings select, .settings input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .zoom-control {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        
        .zoom-control button {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Scanner Angka</h1>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <canvas id="canvasProcessed"></canvas>
        </div>
        
        <div class="controls">
            <button id="scanBtn" class="btn btn-primary">📸 Scan</button>
            <button id="sendBtn" class="btn btn-success" disabled>📤 Kirim</button>
            <button id="clearBtn" class="btn btn-danger">🗑️ Clear</button>
            <button id="enhanceBtn" class="btn btn-warning">🔍 Enhance</button>
        </div>
        
        <div id="loader" class="loader"></div>
        
        <div class="result-container">
            <div class="result-label">Hasil Scan:</div>
            <div id="resultText" class="result-value">-</div>
            <div id="rawText" class="raw-text"></div>
        </div>
        
        <div id="statusMessage" class="status-message"></div>
        
        <div class="manual-input">
            <input type="text" id="manualInput" placeholder="Ketik manual (contoh: 67,50)">
            <button id="manualSendBtn" class="btn btn-success" style="flex: 0 0 auto;">Kirim</button>
        </div>
        
        <div class="settings">
            <label>Mode OCR:
                <select id="ocrMode">
                    <option value="fast">Fast</option>
                    <option value="accurate" selected>Accurate</option>
                    <option value="very_accurate">Very Accurate (Lambat)</option>
                </select>
            </label>
            
            <div class="zoom-control">
                <button id="zoomOutBtn">−</button>
                <span style="flex:1; text-align:center;">Zoom: <span id="zoomLevel">1.0</span>x</span>
                <button id="zoomInBtn">+</button>
            </div>
            
            <label style="margin-top:10px;">
                <input type="checkbox" id="autoScan"> Auto Scan (setiap 3 detik)
            </label>
        </div>
    </div>

    <!-- Load Tesseract.js dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <script>
        // Konfigurasi
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx0TAoGVtii4iQ0Cd-4aIsdCcx9E3P2DWhF99HhXtRJ9axrcECTkdv9SOGtD6-nCcw/exec';
        
        // DOM Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const canvasProcessed = document.getElementById('canvasProcessed');
        const scanBtn = document.getElementById('scanBtn');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const enhanceBtn = document.getElementById('enhanceBtn');
        const resultText = document.getElementById('resultText');
        const rawText = document.getElementById('rawText');
        const statusMessage = document.getElementById('statusMessage');
        const loader = document.getElementById('loader');
        const manualInput = document.getElementById('manualInput');
        const manualSendBtn = document.getElementById('manualSendBtn');
        const ocrMode = document.getElementById('ocrMode');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomLevel = document.getElementById('zoomLevel');
        const autoScanCheck = document.getElementById('autoScan');
        
        let currentResult = null;
        let currentRawText = '';
        let stream = null;
        let zoom = 1.0;
        let autoScanInterval = null;
        let isProcessing = false;
        
        // Inisialisasi kamera
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                video.srcObject = stream;
                await video.play();
                return true;
            } catch (error) {
                showStatus('Gagal mengakses kamera: ' + error.message, 'error');
                return false;
            }
        }
        
        // Preprocessing gambar untuk meningkatkan OCR
        function preprocessImage(imageData, width, height) {
            const ctx = canvasProcessed.getContext('2d');
            canvasProcessed.width = width;
            canvasProcessed.height = height;
            
            // Gambar original
            ctx.putImageData(imageData, 0, 0);
            
            // Ambil data pixel
            const imageData2 = ctx.getImageData(0, 0, width, height);
            const data = imageData2.data;
            
            // Konversi ke grayscale dan thresholding adaptif
            for (let i = 0; i < data.length; i += 4) {
                // Grayscale
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                
                // Contrast enhancement
                const contrast = 1.5;
                const enhanced = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
                
                // Thresholding
                const threshold = 180;
                const value = enhanced > threshold ? 255 : 0;
                
                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
                data[i + 3] = 255;
            }
            
            ctx.putImageData(imageData2, 0, 0);
            return canvasProcessed.toDataURL('image/png');
        }
        
        // Extract angka dengan berbagai metode
        async function extractNumber(imageData, processedImageData) {
            try {
                showStatus('Memproses gambar...', 'info');
                
                let allText = '';
                let bestMatch = null;
                let bestScore = 0;
                
                // Coba dengan gambar asli
                const result1 = await recognizeImage(imageData);
                if (result1) {
                    allText += result1.text + ' ';
                    const parsed = parseNumber(result1.text);
                    if (parsed && result1.confidence > bestScore) {
                        bestMatch = parsed;
                        bestScore = result1.confidence;
                    }
                }
                
                // Coba dengan gambar yang sudah diproses
                if (processedImageData) {
                    const result2 = await recognizeImage(processedImageData);
                    if (result2) {
                        allText += result2.text + ' ';
                        const parsed = parseNumber(result2.text);
                        if (parsed && result2.confidence > bestScore) {
                            bestMatch = parsed;
                            bestScore = result2.confidence;
                        }
                    }
                }
                
                // Simpan raw text
                currentRawText = allText.trim();
                rawText.textContent = 'Raw: ' + currentRawText;
                
                if (bestMatch !== null) {
                    return { number: bestMatch, confidence: bestScore };
                }
                
                // Jika tidak ada yang cocok, coba parse dari semua teks
                const allNumbers = extractAllNumbers(allText);
                if (allNumbers.length > 0) {
                    return { number: allNumbers[0], confidence: 0.3 };
                }
                
                return null;
                
            } catch (error) {
                console.error('OCR Error:', error);
                showStatus('Error saat membaca: ' + error.message, 'error');
                return null;
            }
        }
        
        // Fungsi recognize dengan Tesseract
        async function recognizeImage(imageData) {
            try {
                let mode = 'eng';
                if (ocrMode.value === 'fast') {
                    // Fast mode - hanya angka
                    mode = 'eng';
                } else if (ocrMode.value === 'accurate') {
                    mode = 'eng+ind';
                } else {
                    mode = 'eng+ind+fra';
                }
                
                const result = await Tesseract.recognize(
                    imageData,
                    mode,
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                console.log(`Progress: ${Math.round(m.progress * 100)}%`);
                            }
                        },
                        tessedit_char_whitelist: '0123456789,.- ',
                        tessedit_pageseg_mode: '6', // Uniform block of text
                        tessedit_ocr_engine_mode: '3' // LSTM + Legacy
                    }
                );
                
                const text = result.data.text.trim();
                const confidence = result.data.confidence / 100;
                
                console.log('OCR Result:', text, 'Confidence:', confidence);
                
                return {
                    text: text,
                    confidence: confidence,
                    words: result.data.words
                };
                
            } catch (error) {
                console.error('Recognition Error:', error);
                return null;
            }
        }
        
        // Parse angka dari text
        function parseNumber(text) {
            // Bersihkan text
            let clean = text.replace(/[^\d,.\s-]/g, ' ');
            clean = clean.replace(/\s+/g, ' ');
            
            // Cari pola angka
            const patterns = [
                /(\d+[,.]\d{1,2})/,  // Angka dengan desimal
                /(\d+\.\d+)/,         // Angka dengan titik
                /(\d+,\d+)/,          // Angka dengan koma
                /(\d+)/               // Angka bulat
            ];
            
            for (const pattern of patterns) {
                const match = clean.match(pattern);
                if (match) {
                    let number = match[1];
                    number = number.replace(',', '.').trim();
                    const parsed = parseFloat(number);
                    if (!isNaN(parsed) && parsed > 0) {
                        return parsed;
                    }
                }
            }
            
            return null;
        }
        
        // Extract semua angka dari text
        function extractAllNumbers(text) {
            const numbers = [];
            const matches = text.match(/\d+[,.]\d+|\d+/g);
            if (matches) {
                for (const match of matches) {
                    const num = parseFloat(match.replace(',', '.'));
                    if (!isNaN(num) && num > 0) {
                        numbers.push(num);
                    }
                }
            }
            return numbers;
        }
        
        // Capture dan proses gambar
        function captureAndProcess() {
            const context = canvas.getContext('2d');
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            
            // Zoom
            const cropWidth = vw / zoom;
            const cropHeight = vh / zoom;
            const sx = (vw - cropWidth) / 2;
            const sy = (vh - cropHeight) / 2;
            
            canvas.width = Math.min(800, vw);
            canvas.height = Math.min(600, vh);
            
            context.drawImage(video, sx, sy, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
            
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            
            // Preprocess untuk enhancement
            const processedData = preprocessImage(imageData, canvas.width, canvas.height);
            
            return {
                original: canvas.toDataURL('image/png'),
                processed: processedData
            };
        }
        
        // Main scan function
        async function handleScan() {
            if (isProcessing) return;
            
            try {
                isProcessing = true;
                scanBtn.disabled = true;
                resultText.textContent = 'Memproses...';
                
                // Capture dan process
                const images = captureAndProcess();
                
                // OCR
                const result = await extractNumber(images.original, images.processed);
                
                if (result && result.number !== null) {
                    currentResult = result.number;
                    resultText.textContent = result.number;
                    sendBtn.disabled = false;
                    showStatus(`✅ Angka ${result.number} berhasil dibaca! (Confidence: ${Math.round(result.confidence * 100)}%)`, 'success');
                } else {
                    resultText.textContent = 'Tidak ada angka terdeteksi';
                    currentResult = null;
                    sendBtn.disabled = true;
                    showStatus('❌ Tidak ada angka yang terdeteksi. Coba lagi dengan pencahayaan lebih baik.', 'error');
                }
            } catch (error) {
                console.error('Scan Error:', error);
                resultText.textContent = 'Error';
                showStatus('❌ Error saat scan: ' + error.message, 'error');
            } finally {
                isProcessing = false;
                scanBtn.disabled = false;
            }
        }
        
        // Kirim ke Google Sheet
        async function sendToSheet(number) {
            try {
                loader.style.display = 'block';
                sendBtn.disabled = true;
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        angka: number,
                        timestamp: new Date().toISOString(),
                        rawText: currentRawText
                    })
                });
                
                showStatus('✅ Data berhasil dikirim ke Google Sheet!', 'success');
                
            } catch (error) {
                console.error('Send Error:', error);
                showStatus('❌ Gagal mengirim data: ' + error.message, 'error');
            } finally {
                loader.style.display = 'none';
                sendBtn.disabled = false;
            }
        }
        
        // Tampilkan status
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message';
            
            if (type === 'success') {
                statusMessage.classList.add('status-success');
            } else if (type === 'error') {
                statusMessage.classList.add('status-error');
            } else if (type === 'info') {
                statusMessage.classList.add('status-info');
            }
            
            statusMessage.style.display = 'block';
            
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }
        
        // Handler manual input
        async function handleManualSend() {
            const input = manualInput.value.trim();
            if (!input) {
                showStatus('❌ Silakan masukkan angka', 'error');
                return;
            }
            
            const number = parseFloat(input.replace(',', '.'));
            if (isNaN(number)) {
                showStatus('❌ Format angka tidak valid', 'error');
                return;
            }
            
            currentResult = number;
            resultText.textContent = number;
            sendBtn.disabled = false;
            currentRawText = `Manual: ${input}`;
            rawText.textContent = currentRawText;
            
            await sendToSheet(number);
            manualInput.value = '';
        }
        
        // Clear
        function handleClear() {
            currentResult = null;
            currentRawText = '';
            resultText.textContent = '-';
            rawText.textContent = '';
            sendBtn.disabled = true;
            manualInput.value = '';
            showStatus('Data dibersihkan', 'info');
        }
        
        // Enhance - ambil gambar dan tampilkan preview
        function handleEnhance() {
            const images = captureAndProcess();
            
            // Tampilkan preview processed di canvas
            const img = new Image();
            img.onload = () => {
                const ctx = canvasProcessed.getContext('2d');
                canvasProcessed.width = 400;
                canvasProcessed.height = 300;
                ctx.drawImage(img, 0, 0, 400, 300);
            };
            img.src = images.processed;
            
            showStatus('📷 Gambar di-enhance untuk OCR', 'info');
        }
        
        // Zoom
        function updateZoom() {
            zoomLevel.textContent = zoom.toFixed(1);
        }
        
        zoomInBtn.addEventListener('click', () => {
            zoom = Math.min(3.0, zoom + 0.1);
            updateZoom();
        });
        
        zoomOutBtn.addEventListener('click', () => {
            zoom = Math.max(0.5, zoom - 0.1);
            updateZoom();
        });
        
        // Auto scan
        autoScanCheck.addEventListener('change', () => {
            if (autoScanCheck.checked) {
                autoScanInterval = setInterval(() => {
                    if (!isProcessing) {
                        handleScan();
                    }
                }, 3000);
                showStatus('Auto scan diaktifkan', 'info');
            } else {
                if (autoScanInterval) {
                    clearInterval(autoScanInterval);
                    autoScanInterval = null;
                }
                showStatus('Auto scan dinonaktifkan', 'info');
            }
        });
        
        // Event Listeners
        scanBtn.addEventListener('click', handleScan);
        sendBtn.addEventListener('click', () => {
            if (currentResult !== null) {
                sendToSheet(currentResult);
            }
        });
        clearBtn.addEventListener('click', handleClear);
        enhanceBtn.addEventListener('click', handleEnhance);
        manualSendBtn.addEventListener('click', handleManualSend);
        
        manualInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleManualSend();
            }
        });
        
        // Init
        initCamera();
        
        console.log('Scanner siap digunakan!');
        console.log('URL Web App:', WEB_APP_URL);
        console.log('Tips: Pastikan pencahayaan cukup dan tulisan jelas');
    </script>
</body>
</html>
